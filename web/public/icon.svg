<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .hairline { stroke: #000000; stroke-width: 1.5; fill: none; }
      .hairline-dim { stroke: rgba(0, 0, 0, 0.2); stroke-width: 1; fill: none; stroke-dasharray: 4 6; }
      .bracket { stroke: #000000; stroke-width: 3.5; stroke-linecap: square; fill: none; }
      .spine { stroke: #000000; stroke-linecap: round; }
      .pillar-spine { stroke: #000000; stroke-width: 2.5; stroke-linecap: square; }
      .core { fill: #000000; }
      .aperture { fill: #ffffff; }
      .focal-dot { fill: #000000; }
      .label-text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; font-weight: 700; fill: #000000; letter-spacing: 4px; }
      .sub-text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; font-weight: 700; fill: #000000; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- 100% Binary Monochrome Base Canvas -->
  <rect class="bg" width="512" height="512" />

  <!-- 4 Corner Hairline Brackets (STARK HUD Framing) -->
  <path class="bracket" d="M 28 68 L 28 28 L 68 28" />
  <path class="bracket" d="M 444 28 L 484 28 L 484 68" />
  <path class="bracket" d="M 28 444 L 28 484 L 68 484" />
  <path class="bracket" d="M 444 484 L 484 484 L 484 444" />

  <!-- Telemetry Headers -->
  <text class="label-text" x="256" y="24" text-anchor="middle">STARK // HUD</text>
  <text class="sub-text" x="256" y="498" text-anchor="middle">SINGULARITY</text>

  <!-- Concentric Orbital Reticles -->
  <circle class="hairline-dim" cx="256" cy="256" r="212" />
  <circle class="hairline" cx="256" cy="256" r="168" stroke-dasharray="2 4" />
  <circle class="hairline" cx="256" cy="256" r="116" />

  <!-- Cardinal Precision Crosshair Ticks -->
  <line x1="256" y1="36" x2="256" y2="52" stroke="#000000" stroke-width="2" />
  <line x1="256" y1="460" x2="256" y2="476" stroke="#000000" stroke-width="2" />
  <line x1="36" y1="256" x2="52" y2="256" stroke="#000000" stroke-width="2" />
  <line x1="460" y1="256" x2="476" y2="256" stroke="#000000" stroke-width="2" />

  <!-- Radial Spines of the Living Sea Urchin (24 Mathematical Needles) -->
  <!-- 6 Major Pillar Vectors (0°, 60°, 120°, 180°, 240°, 300°) with Terminal Coordinates -->
  <line class="pillar-spine" x1="256" y1="204" x2="256" y2="60" />
  <circle cx="256" cy="60" r="3" fill="#000000" />

  <line class="pillar-spine" x1="301" y1="230" x2="426" y2="158" />
  <circle cx="426" cy="158" r="3" fill="#000000" />

  <line class="pillar-spine" x1="301" y1="282" x2="426" y2="354" />
  <circle cx="426" cy="354" r="3" fill="#000000" />

  <line class="pillar-spine" x1="256" y1="308" x2="256" y2="452" />
  <circle cx="256" cy="452" r="3" fill="#000000" />

  <line class="pillar-spine" x1="211" y1="282" x2="86" y2="354" />
  <circle cx="86" cy="354" r="3" fill="#000000" />

  <line class="pillar-spine" x1="211" y1="230" x2="86" y2="158" />
  <circle cx="86" cy="158" r="3" fill="#000000" />

  <!-- Intermediate Spines (18 Harmonic Needles) -->
  <line class="spine" x1="269" y1="206" x2="295" y2="108" stroke-width="1.8" />
  <line class="spine" x1="285" y1="213" x2="353" y2="124" stroke-width="1.5" />
  <line class="spine" x1="306" y1="243" x2="431" y2="206" stroke-width="1.8" />
  <line class="spine" x1="308" y1="256" x2="452" y2="256" stroke-width="2.0" />
  <line class="spine" x1="306" y1="269" x2="431" y2="306" stroke-width="1.8" />
  <line class="spine" x1="285" y1="299" x2="353" y2="388" stroke-width="1.5" />
  <line class="spine" x1="269" y1="306" x2="295" y2="404" stroke-width="1.8" />
  <line class="spine" x1="243" y1="306" x2="217" y2="404" stroke-width="1.8" />
  <line class="spine" x1="227" y1="299" x2="159" y2="388" stroke-width="1.5" />
  <line class="spine" x1="206" y1="269" x2="81" y2="306" stroke-width="1.8" />
  <line class="spine" x1="204" y1="256" x2="60" y2="256" stroke-width="2.0" />
  <line class="spine" x1="206" y1="243" x2="81" y2="206" stroke-width="1.8" />
  <line class="spine" x1="227" y1="213" x2="159" y2="124" stroke-width="1.5" />
  <line class="spine" x1="243" y1="206" x2="217" y2="108" stroke-width="1.8" />

  <!-- Additional Dense Micro-Spines for Authentic Urchin Density -->
  <line class="spine" x1="274" y1="220" x2="310" y2="170" stroke-width="1.2" />
  <line class="spine" x1="292" y1="238" x2="350" y2="220" stroke-width="1.2" />
  <line class="spine" x1="292" y1="274" x2="350" y2="292" stroke-width="1.2" />
  <line class="spine" x1="274" y1="292" x2="310" y2="342" stroke-width="1.2" />
  <line class="spine" x1="238" y1="292" x2="202" y2="342" stroke-width="1.2" />
  <line class="spine" x1="220" y1="274" x2="162" y2="292" stroke-width="1.2" />
  <line class="spine" x1="220" y1="238" x2="162" y2="220" stroke-width="1.2" />
  <line class="spine" x1="238" y1="220" x2="202" y2="170" stroke-width="1.2" />

  <!-- Urchin Singularity Core -->
  <circle class="core" cx="256" cy="256" r="52" />
  <circle class="aperture" cx="256" cy="256" r="16" />
  <circle class="focal-dot" cx="256" cy="256" r="5" />
</svg>
