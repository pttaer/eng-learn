<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <!-- Google Fonts: JetBrains Mono & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div id="app">
    <!-- 2.5D Living Canvas Layer -->
    <div id="canvas-container">
      <canvas id="canvas-2d"></canvas>
    </div>

    <!-- Architectural HUD Telemetry Overlay -->
    <div id="hud-overlay">
      <!-- 4 Corner Hairline Brackets -->
      <div class="corner-bracket corner-tl"></div>
      <div class="corner-bracket corner-tr"></div>
      <div class="corner-bracket corner-bl"></div>
      <div class="corner-bracket corner-br"></div>

      <!-- Mount for Top Telemetry Bar -->
      <div id="hud-header-mount"></div>

      <!-- Mount for Active Study Dossier / Workspace -->
      <main id="workspace-mount"></main>
    </div>

    <!-- Mount for Corner Compass Mini-Urchin -->
    <div id="compass-mount"></div>

    <!-- Fullscreen Confetti Particle Celebration Canvas -->
    <canvas id="confettiCanvas"></canvas>

  <!-- Main Entry Script (includes PWA Service Worker registration with update listener) -->
